```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker File Upload</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            max-width: 450px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #007bff;
        }

        input, button {
            margin: 15px;
            padding: 10px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Docker File Upload</h1>
        <p>Select a file to upload to the container.</p>

        <form action="/upload" method="POST"
              enctype="multipart/form-data">

            <input type="file" name="file" required>

            <br>

            <button type="submit">Upload File</button>
        </form>
    </div>
</body>
</html>
